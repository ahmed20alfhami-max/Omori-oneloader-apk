name: Build OMORI IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Download Game Assets
        run: |
          curl -L -o www.zip "https://github.com/ahmed20alfhami-max/Omori-oneloader-apk/releases/download/v1.0/www.zip"
          mkdir -p www
          unzip -q www.zip -d www/
          if [ -d "www/www" ]; then
            cp -r www/www/* www/
            rm -rf www/www
          fi

      - name: Configure Game Settings (Landscape & Disable Touch)
        run: |
          # Inject Landscape preference and disable touch overlays inside game index.html
          if [ -f "www/index.html" ]; then
            sed -i '' 's/<\/head>/<style>html, body { touch-action: none !important; -webkit-user-select: none; pointer-events: none !important; }<\/style><\/head>/g' www/index.html
          fi

      - name: Create Cordova App
        run: |
          cordova create omori-app com.omori.mobile "OMORI"
          cd omori-app
          
          # Force landscape orientation in config.xml
          sed -i '' 's/<\/widget>/  <preference name="Orientation" value="landscape" \/>\n<\/widget>/g' config.xml
          
          cordova platform add ios

      - name: Copy Game Assets
        run: |
          rm -rf omori-app/www/*
          cp -R www/* omori-app/www/

      - name: Build iOS App with Xcode Direct Flags
        run: |
          cd omori-app/platforms/ios
          xcodebuild build \
            -workspace OMORI.xcworkspace \
            -scheme OMORI \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find omori-app/platforms/ios/build -name "OMORI.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r OMORI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORI-IPA
          path: OMORI.ipa
