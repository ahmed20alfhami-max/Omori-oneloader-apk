name: Build and Release OMORI IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Tools
        run: npm install -g cordova

      - name: Download and Unzip APK
        run: |
          APK_URL="https://dl.apkvision.org/omori/OMORI-v1-0-8-1.apk"
          echo "Downloading APK from APKVision..."
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o omori.apk "$APK_URL"
          
          echo "Unzipping APK contents non-interactively..."
          mkdir -p apk_extracted
          unzip -o -q omori.apk -d apk_extracted/
          
          mkdir -p game_www
          cp -R apk_extracted/assets/www/* game_www/

          ICON_PATH=$(find apk_extracted -name "ic_launcher.png" -o -name "icon.png" | head -n 1)
          if [ -n "$ICON_PATH" ]; then
            cp "$ICON_PATH" game_www/app_icon.png
          fi

      - name: Fix Node fs.readFileSync for iOS & Set Up OMORI Font Credits
        run: |
          # Remove Android plugins to stop CoreAndroid prompt dialogs
          rm -rf game_www/plugins/cordova-plugin-android* || true
          rm -f game_www/cordova_plugins.js || true

          node -e '
            const fs = require("fs");
            const file = "game_www/index.html";
            if (fs.existsSync(file)) {
              let html = fs.readFileSync(file, "utf8");
              
              // Polyfill Node.js fs.readFileSync, require, and process for RPG Maker MV on iOS
              const browserPolyfills = `<script>
                window.prompt = function() { return ""; };
                window.CoreAndroid = { execute: function() {}, init: function() {} };
                
                if (typeof window.process === "undefined") {
                  window.process = { platform: "ios", env: {}, mainModule: { filename: location.href } };
                }
                if (typeof window.require === "undefined") {
                  window.require = function(mod) {
                    if (mod === "fs") {
                      return {
                        readFileSync: function(filePath, encoding) {
                          var xhr = new XMLHttpRequest();
                          xhr.open("GET", filePath, false);
                          xhr.send(null);
                          if (xhr.status === 200 || xhr.status === 0) {
                            return xhr.responseText;
                          }
                          return "";
                        },
                        existsSync: function(path) { return true; },
                        statSync: function() { return { isDirectory: function() { return false; } }; }
                      };
                    }
                    if (mod === "path") {
                      return {
                        join: function() { return Array.prototype.slice.call(arguments).join("/"); },
                        dirname: function(p) { return p.substring(0, p.lastIndexOf("/")); }
                      };
                    }
                    return {};
                  };
                }
              </script>`;

              const style = `<style>
                @font-face {
                  font-family: "GameFont";
                  src: url("fonts/OMORI_0.ttf"), url("css/fonts/OMORI_0.ttf"), url("fonts/mplus-1m-regular.ttf");
                }
                html, body { touch-action: none !important; -webkit-user-select: none; pointer-events: none !important; }
                #startup-splash {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100vw;
                  height: 100vh;
                  background-color: #000000;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  z-index: 999999;
                  animation: fadeOutSplash 3.5s forwards 2.5s;
                }
                #startup-text {
                  color: #ffffff;
                  font-size: 32px;
                  font-family: "GameFont", "OMORI", sans-serif;
                  text-align: center;
                  letter-spacing: 1px;
                  text-shadow: 2px 2px 0px #000;
                }
                .custom-credit {
                  position: fixed;
                  bottom: 10px;
                  left: 0;
                  width: 100%;
                  text-align: center;
                  color: #ffffff;
                  font-size: 20px;
                  font-family: "GameFont", "OMORI", sans-serif;
                  letter-spacing: 1px;
                  text-shadow: 2px 2px 4px #000;
                  z-index: 99999;
                  pointer-events: none;
                }
                @keyframes fadeOutSplash { to { opacity: 0; visibility: hidden; } }
              </style>`;
              
              const elements = `<div id="startup-splash"><div id="startup-text">iOS port by ahmad alfhami</div></div><div class="custom-credit">iOS port by ahmad alfhami</div>`;
              
              html = html.replace("<head>", "<head>" + browserPolyfills);
              html = html.replace("</head>", style + "</head>");
              html = html.replace("</body>", elements + "</body>");
              
              fs.writeFileSync(file, html);
            }
          '

      - name: Create Cordova Project
        run: |
          cordova create omori-app omori.mobileahmed.com "OMORI"
          cd omori-app
          
          sed -i '' 's/<\/widget>/  <preference name="Orientation" value="landscape" \/>\n  <preference name="AllowBackForwardNavigationGestures" value="false" \/>\n  <preference name="CordovaWebViewEngine" value="CDVWKWebViewEngine" \/>\n<\/widget>/g' config.xml
          
          cordova platform add ios

      - name: Enable iTunes & Files App File Sharing
        run: |
          PLIST="omori-app/platforms/ios/OMORI/OMORI-Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          fi

      - name: Overwrite Default Cordova Assets & Set App Icon
        run: |
          rm -rf omori-app/www/*
          rm -rf omori-app/platforms/ios/www/*
          cp -R game_www/* omori-app/www/
          cp -R game_www/* omori-app/platforms/ios/www/

          ICON_DIR="omori-app/platforms/ios/OMORI/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          if [ -f "game_www/app_icon.png" ]; then
            cp game_www/app_icon.png "$ICON_DIR/icon-60@2x.png"
            cp game_www/app_icon.png "$ICON_DIR/icon-60@3x.png"
          fi

      - name: Build Real iOS Device Binary
        run: |
          cd omori-app/platforms/ios
          xcodebuild build \
            -workspace OMORI.xcworkspace \
            -scheme OMORI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R omori-app/platforms/ios/build/Build/Products/Release-iphoneos/OMORI.app Payload/
          zip -r omori.ipa Payload

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8-ios
          name: "OMORI iOS Port v1.0.8"
          body: "iOS Port of OMORI v1.0.8 by ahmad alfhami."
          files: omori.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
