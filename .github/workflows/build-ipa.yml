name: Build OMORI IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Download Game Assets
        run: |
          URL="https://github.com/ahmed20alfhami-max/Omori-oneloader-apk/releases/download/v1.0/www.zip"
          curl -L -A "Mozilla/5.0" -o www.zip "$URL"
          
          SIZE=$(wc -c <"www.zip" | tr -d ' ')
          if [ "$SIZE" -lt 1000000 ]; then
            rm www.zip
            wget -O www.zip "$URL"
          fi

          mkdir -p extracted
          unzip -q www.zip -d extracted/

      - name: Create Cordova App & Fix WKWebView CORS
        run: |
          cordova create omori-app com.omori.mobile "OMORI"
          cd omori-app
          
          # Force Landscape & Enable Local Web Scheme to fix WKWebView CORS (stuck at 50%)
          sed -i '' 's/<\/widget>/  <preference name="Orientation" value="landscape" \/>\n  <preference name="scheme" value="app" \/>\n  <preference name="hostname" value="localhost" \/>\n  <preference name="AllowUntrustedCerts" value="true" \/>\n  <preference name="InterceptRemoteRequests" value="all" \/>\n<\/widget>/g' config.xml
          
          cordova platform add ios

      - name: Enable iTunes & Files App File Sharing
        run: |
          PLIST="omori-app/platforms/ios/OMORI/OMORI-Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          fi

      - name: Overwrite Default Files with Game Assets
        run: |
          GAME_DIR=$(dirname $(find extracted -name "index.html" | head -n 1))
          
          # Disable touch input (Controller Only)
          if [ -f "$GAME_DIR/index.html" ]; then
            sed -i '' 's/<\/head>/<style>html, body { touch-action: none !important; -webkit-user-select: none; pointer-events: none !important; }<\/style><\/head>/g' "$GAME_DIR/index.html"
          fi

          # Replace default Cordova templates
          rm -rf omori-app/www/*
          rm -rf omori-app/platforms/ios/www/*
          cp -R "$GAME_DIR"/* omori-app/www/
          cp -R "$GAME_DIR"/* omori-app/platforms/ios/www/

      - name: Build Real iOS Device Binary
        run: |
          cd omori-app/platforms/ios
          xcodebuild build \
            -workspace OMORI.xcworkspace \
            -scheme OMORI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -R omori-app/platforms/ios/build/Build/Products/Release-iphoneos/OMORI.app Payload/
          zip -r OMORI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORI-IPA
          path: OMORI.ipa
