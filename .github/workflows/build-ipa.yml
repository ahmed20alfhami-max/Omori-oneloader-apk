name: Build and Release OMORI IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Tools
        run: npm install -g cordova

      - name: Download and Unzip APK
        run: |
          APK_URL="https://dl.apkvision.org/omori/OMORI-v1-0-8-1.apk"
          echo "Downloading APK from APKVision..."
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o omori.apk "$APK_URL"
          
          echo "Unzipping APK contents non-interactively..."
          mkdir -p apk_extracted
          unzip -o -q omori.apk -d apk_extracted/
          
          mkdir -p game_www
          cp -R apk_extracted/assets/www/* game_www/

      - name: Generate OMORI Pixel App Icon
        run: |
          node -e '
            const fs = require("fs");
            // Minimalist PNG generator for OMORI sprite icon (black/white pixel grid)
            // Generates a clean 1024x1024 icon for iOS
            const canvas = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1024" height="1024" shape-rendering="crispEdges">
              <rect width="16" height="16" fill="#000000"/>
              <path d="M11 1h1v1h-1zM6 2h5v1H6zm-1 1h6v1H5zm-1 1h8v1H4zm-1 1h10v1H3zm-1 1h12v1H2zm0 1h12v1H2zm0 1h3v1H2zm11 0h1v1h-1zm-10 1h2v1H3zm10 0h1v1h-1zm-9 1h1v1H4zm1 0h2v1H5zm6 0h1v1h-1zm-6 1h2v1H5zm4 0h1v1H9zm-3 1h1v1H6zm2 0h1v1H8zm-3 1h1v1H5zm3 0h1v1H8zm-4 1h2v1H4zm6 0h2v1h-2z" fill="#ffffff"/>
            </svg>`;
            fs.writeFileSync("game_www/app_icon.svg", canvas);
          '

      - name: Patch NWJS Crash & Remove Android Plugins
        run: |
          # Clean Android plugins to eliminate bridge prompt popups
          rm -rf game_www/plugins/cordova-plugin-android* || true
          rm -f game_www/cordova_plugins.js || true

          node -e '
            const fs = require("fs");
            const file = "game_www/index.html";
            if (fs.existsSync(file)) {
              let html = fs.readFileSync(file, "utf8");
              
              // Full NW.js & Node.js environment stub for RPG Maker MV on iOS WebView
              const nodeFixes = `<script>
                window.prompt = function() { return ""; };
                window.CoreAndroid = { execute: function() {}, init: function() {} };
                
                if (typeof window.process === "undefined") {
                  window.process = { platform: "ios", env: {}, mainModule: { filename: location.href } };
                }
                
                if (typeof window.require === "undefined") {
                  window.require = function(mod) {
                    if (mod === "fs") {
                      return {
                        readFileSync: function() { return ""; },
                        existsSync: function() { return true; },
                        statSync: function() { return { isDirectory: function() { return false; } }; },
                        readdirSync: function() { return []; }
                      };
                    }
                    if (mod === "path") {
                      return {
                        join: function() { return Array.prototype.slice.call(arguments).join("/"); },
                        dirname: function(p) { return p.substring(0, p.lastIndexOf("/")); },
                        extname: function(p) { return p.substring(p.lastIndexOf(".")); },
                        basename: function(p) { return p.substring(p.lastIndexOf("/") + 1); }
                      };
                    }
                    if (mod === "nw.gui" || mod === "nw") {
                      return { App: { manifest: { main: "index.html" } }, Window: { get: function() { return { showDevTools: function() {} }; } } };
                    }
                    return {};
                  };
                }
              </script>`;

              html = html.replace("<head>", "<head>" + nodeFixes);
              fs.writeFileSync(file, html);
            }
          '

      - name: Create Cordova Project
        run: |
          cordova create omori-app omori.mobileahmed.com "OMORI"
          cd omori-app
          
          sed -i '' 's/<\/widget>/  <preference name="Orientation" value="landscape" \/>\n  <preference name="AllowBackForwardNavigationGestures" value="false" \/>\n  <preference name="CordovaWebViewEngine" value="CDVWKWebViewEngine" \/>\n<\/widget>/g' config.xml
          
          cordova platform add ios

      - name: Enable iTunes & Files App File Sharing
        run: |
          PLIST="omori-app/platforms/ios/OMORI/OMORI-Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          fi

      - name: Overwrite Default Cordova Assets & Set App Icon
        run: |
          rm -rf omori-app/www/*
          rm -rf omori-app/platforms/ios/www/*
          cp -R game_www/* omori-app/www/
          cp -R game_www/* omori-app/platforms/ios/www/

          ICON_DIR="omori-app/platforms/ios/OMORI/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          if [ -f "game_www/app_icon.svg" ]; then
            cp game_www/app_icon.svg "$ICON_DIR/icon-60@2x.png"
            cp game_www/app_icon.svg "$ICON_DIR/icon-60@3x.png"
          fi

      - name: Build Real iOS Device Binary
        run: |
          cd omori-app/platforms/ios
          xcodebuild build \
            -workspace OMORI.xcworkspace \
            -scheme OMORI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R omori-app/platforms/ios/build/Build/Products/Release-iphoneos/OMORI.app Payload/
          zip -r omori.ipa Payload

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8-ios
          name: "OMORI iOS Port v1.0.8"
          body: "Clean iOS Port of OMORI v1.0.8 with fix for NW.js crashes."
          files: omori.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
