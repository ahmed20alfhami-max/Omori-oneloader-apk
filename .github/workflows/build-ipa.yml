name: Build OMORI IPA from Link

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Download and Extract Game Assets
        run: |
          curl -L -o www.zip "https://github.com/ahmed20alfhami-max/Omori-oneloader-apk/releases/download/v1.0/www.zip"
          mkdir -p www
          unzip -q www.zip -d www/
          if [ -d "www/www" ]; then
            cp -r www/www/* www/
            rm -rf www/www
          fi

      - name: Create Cordova App
        run: |
          cordova create omori-app com.omori.mobile "OMORI"
          cd omori-app
          cordova platform add ios

      - name: Copy Game Assets to Cordova
        run: |
          rm -rf omori-app/www/*
          cp -R www/* omori-app/www/

      - name: Build Simulator App (Bypasses Signing)
        run: |
          cd omori-app
          cordova build ios --emulator

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find omori-app/platforms/ios/build -name "OMORI.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r OMORI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORI-IPA
          path: OMORI.ipa
