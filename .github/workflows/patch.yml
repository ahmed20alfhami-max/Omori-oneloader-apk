name: Patch OMORI with OneLoader

on:
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign curl unzip python3-pip
          pip3 install gdown

      - name: Download OMORI APK from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1tUT0FIeLeB3odSzXnhlViTKIuGPgu2BF" -O omori.apk

      - name: Unpack OMORI APK
        run: |
          # Decompile without -s so AndroidManifest.xml can be safely modified
          apktool d -r omori.apk -o omori_decompiled

      - name: Fetch Latest OneLoader Release
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/rphsoftware/OneLoader/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          curl -L -o oneloader.zip "$LATEST_URL"
          unzip oneloader.zip -d oneloader_files

      - name: Inject OneLoader & Fix Display Layout
        run: |
          # Locate game root asset directory containing index.html
          GAME_DIR=$(find omori_decompiled/assets -name "index.html" -exec dirname {} \;)
          echo "Game root found at: $GAME_DIR"

          # Safely copy OneLoader assets (handling either www/ layout or root layout)
          if [ -d "oneloader_files/www" ]; then
            cp -r oneloader_files/www/* "$GAME_DIR/"
          else
            cp -r oneloader_files/* "$GAME_DIR/"
          fi

          # Ensure the mods directory exists
          mkdir -p "$GAME_DIR/mods"

          # Force viewport meta tag for full Android screen width scaling
          if grep -q '<meta name="viewport"' "$GAME_DIR/index.html"; then
            sed -i 's|<meta name="viewport"[^>]*>|<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">|g' "$GAME_DIR/index.html"
          else
            sed -i 's|</head>|<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"></head>|g' "$GAME_DIR/index.html"
          fi

          # Force landscape orientation inside AndroidManifest.xml
          if [ -f "omori_decompiled/AndroidManifest.xml" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' omori_decompiled/AndroidManifest.xml
          fi

      - name: Rebuild APK
        run: |
          apktool b omori_decompiled -o omori_unsigned.apk

      - name: Create Key and Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias debugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 omori_unsigned.apk omori_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out omori-oneloader-signed.apk omori_aligned.apk

      - name: Upload Modded APK
        uses: actions/upload-artifact@v4
        with:
          name: OMORI-OneLoader-APK
          path: omori-oneloader-signed.apk
