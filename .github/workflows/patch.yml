name: Patch OMORI with OneLoader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign curl unzip python3-pip
          pip3 install gdown

      - name: Download OMORI APK from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1tUT0FIeLeB3odSzXnhlViTKIuGPgu2BF" -O omori.apk

      - name: Unpack OMORI APK
        run: |
          apktool d -r -s omori.apk -o omori_decompiled

      - name: Fetch Latest OneLoader Release
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/rphsoftware/OneLoader/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          curl -L -o oneloader.zip "$LATEST_URL"
          unzip oneloader.zip -d oneloader_files

      - name: Inject OneLoader & Apply Mobile Load Fixes
        run: |
          # Find directory containing index.html inside assets
          GAME_DIR=$(find omori_decompiled/assets -name "index.html" -exec dirname {} \;)
          echo "Game root is: $GAME_DIR"

          if [ -d "oneloader_files/www" ]; then
            SRC_DIR="oneloader_files/www"
          else
            SRC_DIR="oneloader_files"
          fi

          # Copy OneLoader assets into game root
          cp -r "$SRC_DIR"/* "$GAME_DIR"/
          mkdir -p "$GAME_DIR/mods"

          # Fix 50% load freeze: Override Node environment check for Android Webview
          cat << 'EOF' > "$GAME_DIR/modloader/mobile_fix.js"
          window.isNwjs = false;
          window.require = window.require || function(module) {
            return {
              fs: {},
              path: {},
              child_process: {}
            };
          };
          EOF

          # Inject mobile fix script right before modloader main entry point in index.html
          VIEWPORT_META='<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">'
          LANDSCAPE_CSS="<style>html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #000; }</style>"
          FIX_SCRIPT='<script src="modloader/mobile_fix.js"></script>'

          sed -i "s|</head>|${VIEWPORT_META}${LANDSCAPE_CSS}${FIX_SCRIPT}</head>|g" "$GAME_DIR/index.html"

      - name: Rebuild APK
        run: |
          apktool b omori_decompiled -o omori_unsigned.apk

      - name: Create Key and Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias debugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 omori_unsigned.apk omori_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out omori-oneloader.apk omori_aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: OMORI OneLoader Build #${{ github.run_number }}
          body: |
            Automated OMORI OneLoader build.
            - Screen Display: Fullscreen Landscape
            - Fixes: Mobile Webview polyfill for OneLoader 50% load freeze
          files: omori-oneloader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
