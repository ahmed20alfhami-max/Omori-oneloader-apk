name: Patch OMORI with OneLoader (Steam Assets)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign curl unzip python3-pip
          pip3 install gdown

      - name: Download OMORI Base APK
        run: |
          gdown "https://drive.google.com/uc?id=1tUT0FIeLeB3odSzXnhlViTKIuGPgu2BF" -O omori.apk

      - name: Download Steam www Zip from GitHub Release
        run: |
          curl -L -o steam_www.zip "https://github.com/ahmed20alfhami-max/Omori-oneloader-apk/releases/download/v1.0/www.zip"
          mkdir -p steam_assets
          unzip -q -o steam_www.zip -d steam_assets

      - name: Decompile Base APK
        run: |
          apktool d -r -s omori.apk -o omori_decompiled -f

      - name: Fetch Latest OneLoader Release
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/rphsoftware/OneLoader/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          curl -L -o oneloader.zip "$LATEST_URL"
          mkdir -p oneloader_files
          unzip -q -o oneloader.zip -d oneloader_files

      - name: Merge Assets, OneLoader, Controller Config & Landscape Mode Lol
        run: |
          # 1. Locate APK game root
          APK_GAME_DIR=$(find omori_decompiled/assets -name "index.html" | head -n 1 | xargs dirname)
          echo "Target APK game root: $APK_GAME_DIR"

          # 2. Locate extracted Steam www root containing index.html or data folder
          STEAM_DIR=$(find steam_assets -name "data" -type d | head -n 1 | xargs dirname)
          if [ -z "$STEAM_DIR" ]; then
            STEAM_DIR=$(find steam_assets -name "index.html" | head -n 1 | xargs dirname)
          fi
          echo "Found Steam source root at: $STEAM_DIR"

          # Copy Steam assets to APK game root
          cp -r "$STEAM_DIR"/* "$APK_GAME_DIR"/

          # 3. Locate OneLoader source root
          ONELOADER_DIR=$(find oneloader_files -name "modloader" -type d | head -n 1 | xargs dirname)
          echo "Found OneLoader root at: $ONELOADER_DIR"
          cp -r "$ONELOADER_DIR"/* "$APK_GAME_DIR"/
          mkdir -p "$APK_GAME_DIR/mods"

          # 4. Inject mobile polyfill, remove touch controllers, enable Bluetooth gamepad
          cat << 'EOF' > "$APK_GAME_DIR/modloader/custom_input.js"
          window.isNwjs = false;
          window.require = window.require || function(module) {
            return {
              fs: { readFileSync: function(){}, writeFileSync: function(){}, existsSync: function(){ return false; } },
              path: { join: function(){ return ""; }, resolve: function(){ return ""; } },
              child_process: {}
            };
          };

          // Completely hide virtual touch gamepads/overlays
          document.addEventListener("DOMContentLoaded", function() {
            const style = document.createElement('style');
            style.innerHTML = `
              html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #000; }
              #touch-overlay, .touch-controls, .virtual-gamepad, canvas.touch-button, #VirtualGamepad { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
            `;
            document.head.appendChild(style);
          });
          EOF

          VIEWPORT_META='<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">'
          INPUT_SCRIPT='<script src="modloader/custom_input.js"></script>'

          sed -i "s|</head>|${VIEWPORT_META}${INPUT_SCRIPT}</head>|g" "$APK_GAME_DIR/index.html"

      - name: Rebuild APK
        run: |
          apktool b omori_decompiled -o omori_unsigned.apk

      - name: Create Key and Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias debugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 omori_unsigned.apk omori_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out omori-oneloader.apk omori_aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: OMORI OneLoader Controller Build #${{ github.run_number }}
          body: |
            Automated OMORI OneLoader build:
            - Steam assets merged
            - Fullscreen landscape mode enabled
            - Virtual touch controls removed
            - Physical/Bluetooth controller input active
          files: omori-oneloader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
