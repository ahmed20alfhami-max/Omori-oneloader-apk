name: Patch OMORI with OneLoader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign curl unzip python3-pip
          pip3 install gdown

      - name: Download OMORI APK from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1tUT0FIeLeB3odSzXnhlViTKIuGPgu2BF" -O omori.apk

      - name: Unpack OMORI APK
        run: |
          apktool d -s omori.apk -o omori_decompiled

      - name: Configure Package Name & Force Landscape Mode
        run: |
          # Update package name
          OLD_PKG=$(grep -oP 'package="\K[^"]+' omori_decompiled/AndroidManifest.xml)
          echo "Original package name: $OLD_PKG"
          sed -i 's/package="'"$OLD_PKG"'"/package="omocat.omoriahamd.com"/g' omori_decompiled/AndroidManifest.xml
          
          # Force landscape orientation for all activities
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' omori_decompiled/AndroidManifest.xml
          if ! grep -q 'android:screenOrientation=' omori_decompiled/AndroidManifest.xml; then
            sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /g' omori_decompiled/AndroidManifest.xml
          fi

      - name: Fetch Latest OneLoader Release
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/rphsoftware/OneLoader/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          curl -L -o oneloader.zip "$LATEST_URL"
          unzip oneloader.zip -d oneloader_files

      - name: Inject OneLoader & Fix Viewport Scale
        run: |
          # Find directory containing index.html inside decompiled assets
          GAME_DIR=$(find omori_decompiled/assets -name "index.html" -exec dirname {} \;)
          echo "Game root is: $GAME_DIR"

          # Determine OneLoader source path (supports root or www/ subfolder)
          if [ -d "oneloader_files/www" ]; then
            SRC_DIR="oneloader_files/www"
          else
            SRC_DIR="oneloader_files"
          fi

          # Copy OneLoader assets into game root
          cp -r "$SRC_DIR"/* "$GAME_DIR"/
          mkdir -p "$GAME_DIR/mods"

          # Ensure full-width viewport meta tag is injected into index.html
          if ! grep -q 'name="viewport"' "$GAME_DIR/index.html"; then
            sed -i 's|</head>|<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"></head>|g' "$GAME_DIR/index.html"
          fi

      - name: Rebuild APK
        run: |
          apktool b omori_decompiled -o omori_unsigned.apk

      - name: Create Key and Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias debugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 omori_unsigned.apk omori_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out omori-oneloader.apk omori_aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: OMORI OneLoader Build #${{ github.run_number }}
          body: |
            Automated OMORI OneLoader build.
            - Package Name: `omocat.omoriahamd.com`
            - Output File: `omori-oneloader.apk`
            - Screen Mode: Landscape Forced with Viewport Scaling
          files: omori-oneloader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
