name: Patch OMORI with OneLoader

on:
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign curl unzip python3-pip
          pip3 install gdown

      - name: Download OMORI APK from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1tUT0FIeLeB3odSzXnhlViTKIuGPgu2BF" -O omori.apk

      - name: Unpack OMORI APK
        run: |
          apktool d -r -s omori.apk -o omori_decompiled

      - name: Fetch Latest OneLoader Release
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/rphsoftware/OneLoader/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          curl -L -o oneloader.zip "$LATEST_URL"
          unzip oneloader.zip -d oneloader_files

      - name: Inject OneLoader
        run: |
          # Find directory containing index.html inside decompiled assets
          GAME_DIR=$(find omori_decompiled/assets -name "index.html" -exec dirname {} \;)
          echo "Game root is: $GAME_DIR"

          # Copy modloader scripts and mods directory
          cp -r oneloader_files/modloader "$GAME_DIR/"
          mkdir -p "$GAME_DIR/mods"

          # Link modloader inside index.html without replacing the app startup script
          if ! grep -q "modloader/main.js" "$GAME_DIR/index.html"; then
            sed -i 's|</head>|<script type="text/javascript" src="modloader/main.js"></script></head>|g' "$GAME_DIR/index.html"
          fi

      - name: Rebuild APK
        run: |
          apktool b omori_decompiled -o omori_unsigned.apk

      - name: Create Key and Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias debugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 omori_unsigned.apk omori_aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out omori-oneloader-signed.apk omori_aligned.apk

      - name: Upload Modded APK
        uses: actions/upload-artifact@v4
        with:
          name: OMORI-OneLoader-APK
          path: omori-oneloader-signed.apk
